baseURL: "https://soanguy.github.io/"
title: "Soanguy的笔记"
theme: hextra

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: context
      name: ConTeXt
      pageRef: /context
      weight: 1
    - identifier: japanese
      name: Japanese
      pageRef: /japanese
      weight: 2
    - identifier: projects
      name: Projects
      pageRef: /projects
      weight: 3
    - identifier: blogs
      name: Blogs
      pageRef: /blogs
      weight: 4
    - identifier: archives
      name: Archives
      pageRef: /archives
      weight: 5
    - identifier: about
      name: About
      pageRef: /about
      weight: 6
    - name: 搜索
      weight: 7
      params:
        type: search
    - name: 主题
      weight: 8
      params:
        type: theme-toggle
    - name: GitHub
      weight: 9
      url: "https://github.com/yourname/yourrepo"
      params:
        icon: github

params:
  description: "一个现代化的 Hugo 文档网站"
  
  # ZenMode: 设置为 true 禁用噪音效果，设置为 false 或不设置则启用噪音效果
  ZenMode: false
  
  # Archives: 归档页面配置
  archives:
    section: blogs  # 指定要归档的 section
    dateFormat: "01-02"  # 日期格式

  banner:
    message: |
      欢迎来到我的网站！🎉

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
    width: wide

  theme:
    default: system
    displayToggle: false

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: wide

  displayUpdatedDate: true
  dateFormat: "2006年1月2日"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 10
    article:
      displayPagination: true

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: normal
    contextMenu:
      enable: false

  imageZoom:
    enable: true

  comments:
    enable: false

  mermaid:
    enable: false

  katex:
    enable: false