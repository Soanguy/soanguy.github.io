      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Frex Sans GB VF", "Inter", sans-serif;
        background: linear-gradient(135deg, #fffef7 0%, #fef8f0 100%);
        color: #1e1e2a;
        line-height: 1.6;
        min-height: 100vh;
      }

      :root {
        --primary-red: #9b1d2c;
        --primary-dark: #7a141f;
        --gold-accent: #d4af37;
        --light-bg: #fef8f0;
        --card-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.08);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
        padding: 2rem;
        background: white;
        border-radius: 20px;
        box-shadow: var(--card-shadow);
      }

      .header h1 {
        font-size: 2.5rem;
        color: var(--primary-red);
        margin-bottom: 0.5rem;
        font-weight: 700;
      }

      .header p {
        color: #666;
        font-size: 1.1rem;
      }

      .progress-bar {
        background: #f0e2d0;
        border-radius: 10px;
        height: 8px;
        margin: 1.5rem 0;
        overflow: hidden;
      }

      .progress-fill {
        background: linear-gradient(90deg, var(--primary-red), var(--gold-accent));
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
        border-radius: 10px;
      }

      .info-card {
        background: white;
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--card-shadow);
      }

      .info-card h3 {
        color: var(--primary-red);
        margin-bottom: 1.5rem;
        font-size: 1.3rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
      }

      .form-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid #f0e2d0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary-red);
        background: #fef8f0;
      }

      .question-card {
        background: white;
        border-radius: 16px;
        padding: 1.5rem 2rem;
        margin-bottom: 1rem;
        box-shadow: var(--card-shadow);
        transition: transform 0.2s ease;
      }

      .question-card:hover {
        transform: translateY(-2px);
      }

      .question-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .question-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-red);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-weight: 600;
        font-size: 0.9rem;
        flex-shrink: 0;
      }

      .question-text {
        font-size: 1.1rem;
        font-weight: 600;
        color: #1e1e2a;
      }

      .options-horizontal {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .option-circle {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
        cursor: pointer;
        flex: 1;
      }

      .option-circle input {
        display: none;
      }

      .circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #f0e2d0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.2s ease;
        background: white;
      }

      .option-circle:hover .circle {
        border-color: var(--primary-red);
        background: #fef8f0;
      }

      .option-circle.selected .circle {
        background: var(--primary-red);
        border-color: var(--primary-red);
        color: white;
        transform: scale(1.1);
      }

      .option-label {
        font-size: 0.75rem;
        color: #666;
        text-align: center;
        line-height: 1.2;
      }

      .submit-btn {
        display: block;
        width: 100%;
        padding: 1.2rem;
        background: linear-gradient(135deg, var(--primary-red), var(--primary-dark));
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 2rem;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(155, 29, 44, 0.3);
      }

      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .result-section {
        display: none;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-card {
        background: white;
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--card-shadow);
        border-left: 4px solid var(--primary-red);
      }

      .result-title {
        font-size: 1.4rem;
        color: var(--primary-red);
        margin-bottom: 1rem;
        font-weight: 700;
      }

      .score-display {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .score-number {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--primary-red);
      }

      .score-bar {
        flex: 1;
        height: 12px;
        background: #f0e2d0;
        border-radius: 6px;
        overflow: hidden;
      }

      .score-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--primary-red), var(--gold-accent));
        transition: width 1s ease;
      }

      .score-level {
        display: inline-block;
        padding: 0.3rem 1rem;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .score-level.low {
        background: #fff3cd;
        color: #856404;
      }

      .score-level.medium {
        background: #d1ecf1;
        color: #0c5460;
      }

      .score-level.high {
        background: #d4edda;
        color: #155724;
      }

      .result-description {
        color: #555;
        margin-bottom: 1rem;
        line-height: 1.8;
      }

      .recommendation {
        background: #fef8f0;
        padding: 1rem;
        border-radius: 8px;
        border-left: 3px solid var(--gold-accent);
      }

      .recommendation-title {
        font-weight: 600;
        color: var(--primary-dark);
        margin-bottom: 0.5rem;
      }

      .restart-btn {
        display: inline-block;
        padding: 0.8rem 2rem;
        background: white;
        color: var(--primary-red);
        border: 2px solid var(--primary-red);
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 1rem;
      }

      .restart-btn:hover {
        background: var(--primary-red);
        color: white;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 2rem;
        }

        .question-card {
          padding: 1.2rem 1.5rem;
        }

        .circle {
          width: 35px;
          height: 35px;
          font-size: 0.85rem;
        }

        .option-label {
          font-size: 0.65rem;
        }
      }
    </style>
  </head>

    <script>
      const SUPABASE_URL = 'https://eashyyulgfphrihovuvj.supabase.co';

      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const optionCircles = document.querySelectorAll('.option-circle');

      let answeredQuestions = new Set();

      optionCircles.forEach(option => {

          const input = this.querySelector('input');
          const questionCard = this.closest('.question-card');
          const questionId = questionCard.id;

          const allOptions = questionCard.querySelectorAll('.option-circle');
          allOptions.forEach(opt => opt.classList.remove('selected'));

          this.classList.add('selected');
          input.checked = true;

          answeredQuestions.add(questionId);
          updateProgress();
        });
      });

      function validateContact(contact) {
        const phoneRegex = /^1[3-9]\d{9}$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (phoneRegex.test(contact)) {
          return { valid: true, type: 'phone' };
        } else if (emailRegex.test(contact)) {
          return { valid: true, type: 'email' };
        } else {
          return { valid: false, type: null };
        }
      }

      function updateProgress() {
        const progress = (answeredQuestions.size / 10) * 100;
        progressFill.style.width = progress + '%';
        progressText.textContent = `已完成: ${answeredQuestions.size} / 10`;

        const userName = document.getElementById('userName').value.trim();
        const userContact = document.getElementById('userContact').value.trim();
        const contactHint = document.getElementById('contactHint');
        const contactInput = document.getElementById('userContact');

        if (userContact) {
          const validation = validateContact(userContact);
          if (validation.valid) {
            contactHint.textContent = validation.type === 'phone' ? '✓ 手机号格式正确' : '✓ 邮箱格式正确';
            contactHint.style.color = '#28a745';
            contactInput.style.borderColor = '#28a745';
          } else {
            contactHint.textContent = '✗ 请输入正确的手机号或邮箱格式';
            contactHint.style.color = '#dc3545';
            contactInput.style.borderColor = '#dc3545';
          }
        } else {
          contactHint.textContent = '支持手机号（11位数字）或邮箱格式';
          contactHint.style.color = '#999';
          contactInput.style.borderColor = '#f0e2d0';
        }

        const validation = validateContact(userContact);
        if (answeredQuestions.size === 10 && userName && validation.valid) {
          submitBtn.disabled = false;
        } else {
          submitBtn.disabled = true;
        }
      }

      document.getElementById('userName').addEventListener('input', updateProgress);
      document.getElementById('userContact').addEventListener('input', updateProgress);

      tipiForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在保存...';

        const formData = new FormData(tipiForm);
        const userName = formData.get('userName');
        const userContact = formData.get('userContact');
        const answers = {};

        for (let [key, value] of formData.entries()) {
          if (key.startsWith('Q')) {
            answers[key] = parseInt(value);
          }
        }

        const scores = calculateScores(answers);

        const exportData = {
          timestamp: new Date().toISOString(),
          userName,
          userContact,
          answers,
          scores
        };

        try {
          const { data, error } = await supabaseClient
            .from('tipi_results')
            .insert([
              {
                user_name: userName,
                user_contact: userContact,
                answers: answers,
                scores: scores
              }
            ]);

          if (error) {
            console.error('保存失败:', error);
            alert('数据保存失败，请检查网络连接后重试。');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交测评';
            return;
          }

          console.log('保存成功:', data);
          displayResults(userName, scores);
          localStorage.setItem('tipi_latest', JSON.stringify(exportData));

        } catch (err) {
          console.error('保存出错:', err);
          alert('数据保存失败，请检查网络连接后重试。');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交测评';
        }
      });

      function reverseScore(value) {
        return 8 - value;
      }

      function calculateScores(answers) {
        return {
          Extraversion: (answers.Q1 + reverseScore(answers.Q6)) / 2,
          Agreeableness: (reverseScore(answers.Q2) + answers.Q7) / 2,
          Conscientiousness: (answers.Q3 + reverseScore(answers.Q8)) / 2,
          EmotionalStability: (reverseScore(answers.Q4) + answers.Q9) / 2,
          Openness: (answers.Q5 + reverseScore(answers.Q10)) / 2
        };
      }

      function getLevel(score) {
        if (score < 4) return 'low';
        if (score < 5.5) return 'medium';
        return 'high';
      }

      function displayResults(userName, scores) {
        tipiForm.style.display = 'none';

        document.getElementById('resultUserName').textContent = `测评对象：${userName}`;

        let profileHTML = `
          <div class="result-card" style="background: linear-gradient(135deg, #fff 0%, #fef8f0 100%);">

              <i class="fas fa-user-circle"></i> 你的五维性格画像
            </div>
        `;

        const sortedDimensions = Object.entries(scores).sort((a, b) => b[1] - a[1]);

        for (let [dimension, score] of sortedDimensions) {
          const level = getLevel(score);
          const data = dimensionData[dimension];
          const percentage = ((score - 1) / 6) * 100;

          let levelIcon = '';
          let levelColor = '';
          let levelBg = '';

          if (score >= 6) {
            levelIcon = ' ✅';
            levelColor = '#155724';
            levelBg = '#d4edda';
          } else if (score < 4) {
            levelIcon = ' ⚠️';
            levelColor = '#721c24';
            levelBg = '#f8d7da';
          } else {
            levelIcon = '';
            levelColor = '#0c5460';
            levelBg = '#d1ecf1';
          }

          profileHTML += `
            <div style="margin-bottom: 1.5rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">

            </div>
          `;
        }

        profileHTML += `</div>`;

        let teacherRecommendations = [];

          teacherRecommendations.push('需要情绪稳定、耐心包容的老师（匹配你的低情绪稳定性）');

          teacherRecommendations.push('适合活泼互动、鼓励讨论的老师（匹配你的高外向性）');

          teacherRecommendations.push('适合温和内向、注重一对一交流的老师（匹配你的低外向性）');

        if (scores.Openness >= 5.5) {
          teacherRecommendations.push('适合知识广博、喜欢拓展延伸的老师（匹配你的高开放性）');

      function toggleDetails() {
        const content = document.getElementById('detailContent');
        const icon = document.getElementById('detailIcon');

        if (content.style.display === 'none') {
          content.style.display = 'block';
          icon.classList.remove('fa-chevron-down');
          icon.classList.add('fa-chevron-up');
        } else {
          content.style.display = 'none';
