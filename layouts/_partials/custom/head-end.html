{{- /* 引入榫黑体可变字体 */ -}}
<link href="https://fontsapi.zeoseven.com/821/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style"
  crossorigin />
<noscript>
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/821/main/result.css" />
</noscript>

{{- /* 噪音效果 */ -}}
{{- if not site.Params.ZenMode -}}
{{- $js := resources.Get "js/grain-effect.js" -}}
{{- if $js -}}
<script src="{{ $js.RelPermalink }}" defer></script>
{{- end -}}
{{- end -}}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const cards = document.querySelectorAll('.hextra-card');

    cards.forEach(card => {
      // 初始状态
      card.style.transition = 'transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)';

      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();

        // 核心优化 1：限制坐标范围。即使鼠标在边缘微动，也不会导致坐标溢出
        const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // 核心优化 2：降低最大倾斜角度（从 12 降为 6），手感更稳重
        const maxRotate = 6;

        const percentX = (x - centerX) / centerX;
        const percentY = (y - centerY) / centerY;

        const rotateY = percentX * maxRotate;
        const rotateX = -percentY * maxRotate;

        // 核心优化 3：增加一点响应延迟（0.2s），像加了阻尼器，吸收边缘的高频抖动
        card.style.transition = 'transform 0.2s ease-out';
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        card.style.zIndex = '50';
      });

      card.addEventListener('mouseleave', () => {
        // 鼠标离开时，用较长的时间回正，像皮筋慢慢回缩
        card.style.transition = 'transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
        card.style.zIndex = '1';
      });
    });
  });
</script>
